name: Eburum verify
on:
  pull_request:
    paths: ["eburum/**", ".github/workflows/verify.yml"]
  push:
    branches: [main]
    paths: ["eburum/**", ".github/workflows/verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eburum-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eburum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            eburum/package-lock.json
            eburum/tests/package-lock.json
      - run: npm ci
      - run: npm --prefix tests ci
      - run: npm run verify

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eburum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            eburum/package-lock.json
            eburum/tests/package-lock.json
      - run: npm ci
      - run: npm --prefix tests ci
      - run: npx playwright install --with-deps chromium
        working-directory: eburum/tests
      - run: npm --prefix tests run browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eburum-browser-review
          path: |
            eburum/tests/playwright-report/
            eburum/tests/test-results/
          retention-days: 7
